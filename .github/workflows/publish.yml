# .github/workflows/publish.yml
# AIDEV-NOTE: PyPI publishing workflow using trusted publishing (OIDC).
# - On release: Publishes to production PyPI and attaches artifacts to GitHub release
# - On workflow_dispatch: Can publish to TestPyPI (test_pypi=true) or production PyPI
# - Production PyPI publishes require a valid vX.Y.Z tag
# - Actions pinned to SHAs per security best practices
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead'
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA). For production PyPI, must be a vX.Y.Z tag.'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # AIDEV-NOTE: Tag validation runs for both release events and production workflow_dispatch.
      # Ensures only properly formatted version tags can publish to production PyPI.
      - name: Validate release tag format
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "✓ Valid release tag: $TAG"
          else
            echo "::error::Release tag must match vX.Y.Z format (got: $TAG)"
            exit 1
          fi

      - name: Validate ref for production PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_pypi != true
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" =~ ^(refs/tags/)?v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "✓ Valid release tag: $REF"
          else
            echo "::error::Production PyPI publishing requires a release tag (vX.Y.Z format)."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify checkout is at a tag (production only)
        if: github.event_name == 'workflow_dispatch' && inputs.test_pypi != true
        run: |
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null) || {
            echo "::error::Current checkout is not at a tag."
            exit 1
          }
          echo "✓ Verified checkout is at tag: $TAG"

      - name: Verify package version matches tag
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_pypi != true)
        run: |
          # Extract version from pyproject.toml
          PKG_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # Get tag without 'v' prefix
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(git describe --exact-match --tags HEAD)
          fi
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" = "$TAG_VERSION" ]; then
            echo "✓ Package version ($PKG_VERSION) matches tag version ($TAG_VERSION)"
          else
            echo "::error::Package version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Build package
        run: uv build

      - name: Verify package with twine
        run: uv tool run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pypi == true && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          sparse-checkout: ''

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pypi == true && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
