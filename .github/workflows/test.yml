# .github/workflows/test.yml
# AIDEV-NOTE: Actions pinned to SHAs per security best practices
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# AIDEV-NOTE: Explicit minimal permissions reduce supply-chain attack surface
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          # AIDEV-NOTE: Pin to specific version to avoid supply-chain drift
          version: "0.5.x"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --all-groups --frozen
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --tb=short -v
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run type checking
        run: uv run mypy statshed_cli
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run linting
        run: uv run ruff check statshed_cli tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run ruff format --check statshed_cli tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
